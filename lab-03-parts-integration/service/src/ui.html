<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part history</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; color: #222;
         max-width: 60rem; }
  h1 { font-size: 1.4rem; color: #1F4E79; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  input { padding: .4rem; border: 1px solid #999; border-radius: 4px; }
  button { padding: .4rem 1rem; background: #1F4E79; color: #fff; border: 0;
           border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; }
  th { background: #D9E2F1; }
  .error { color: #a00; }
  code { font-size: .8rem; }
</style>
</head>
<body>
<h1>Part history from the shared ledger</h1>
<form id="f">
  <input id="key" type="password" placeholder="API key" autocomplete="off" required>
  <input id="serial" placeholder="Serial, e.g. ESN-1001" required>
  <button>Show history</button>
</form>
<div id="out"></div>
<script>
// The key stays in this page's memory: it is never written to storage or the URL.
const out = document.getElementById('out');
const cell = (text) => { const td = document.createElement('td');
  td.textContent = text; return td; };
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  out.textContent = 'Loading...';
  const serial = encodeURIComponent(document.getElementById('serial').value.trim());
  const res = await fetch(`/parts/${serial}/history`,
    {headers: {authorization: `Bearer ${document.getElementById('key').value}`}});
  const body = await res.json();
  out.textContent = '';
  if (!res.ok) {
    const p = document.createElement('p'); p.className = 'error';
    p.textContent = `${res.status}: ${body.detail || body.error}`;
    out.append(p); return;
  }
  const table = document.createElement('table');
  const head = document.createElement('tr');
  ['When', 'Status', 'Aircraft', 'Position', 'Cycles', 'By', 'Transaction']
    .forEach((h) => { const th = document.createElement('th');
      th.textContent = h; head.append(th); });
  table.append(head);
  for (const e of body) {
    const tr = document.createElement('tr');
    tr.append(cell(e.at.replace('T', ' ').slice(0, 19)), cell(e.status),
      cell(e.aircraft || '-'), cell(e.position || '-'), cell(e.cycles), cell(e.by));
    const tx = cell(''); const c = document.createElement('code');
    c.textContent = e.txId.slice(0, 12); tx.append(c); tr.append(tx);
    table.append(tr);
  }
  out.append(table);
});
</script>
</body>
</html>
